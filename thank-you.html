<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow" />
    <title>Thank You | Cyril Ernest Landscapes</title>
    <link rel="stylesheet" href="style.css">

        <link rel="canonical" href="https://cyrilernest.co.uk/thank-you.html" />
</head>
<body class="flex flex-col min-h-screen text-white antialiased" style="background-color:#1A1A1A;" data-page="thankyou-dark">

    <div id="header-placeholder"></div>

    <main class="flex-grow flex items-center justify-center py-24 md:py-32 pt-36 md:pt-52">
        <div class="container mx-auto px-6 max-w-4xl text-center">

            <div class="reveal reveal-up flex flex-col items-center">
                <div class="w-24 h-24 bg-white/5 rounded-full flex items-center justify-center mx-auto mb-10 border-2 border-[#df5164] shadow-[0_0_40px_rgba(223,81,100,0.25)]">
                    <svg class="w-12 h-12 text-[#df5164]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>

                <h1 class="font-heading text-5xl md:text-6xl lg:text-7xl text-white font-bold mb-4 uppercase tracking-wide">Thank You</h1>
                <span class="block w-20 h-1 bg-[#df5164] rounded-full mx-auto mb-5"></span>

                <p class="font-body text-lg md:text-xl mb-12 max-w-xl mx-auto leading-relaxed" style="color:#ffffff;">
                    Tony or a member of the team will be in touch as soon as possible. Expect a call within the next 24 to 48 hours.
                </p>

                <a href="index.html" class="btn-pill group relative inline-flex items-center justify-between gap-4 pl-6 pr-2 py-3 bg-[#df5164] font-body font-bold text-lg rounded-full overflow-hidden transition-transform duration-500 hover:scale-105 shadow-[0_0_24px_rgba(223,81,100,0.3)] border-none">
                    <span class="absolute right-2.5 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/20 rounded-full transition-transform duration-700 ease-[cubic-bezier(0.19,1,0.22,1)] group-hover:scale-[25] z-0"></span>
                    <span class="relative z-10 text-white transition-colors duration-500">Return to Homepage</span>
                    <span class="relative z-10 w-10 h-10 flex items-center justify-center bg-white rounded-full">
                        <svg class="w-5 h-5 text-[#df5164] transition-transform duration-500 ease-in-out group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </span>
                </a>
            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="global.js"></script>

</body>
</html>
